# Deletes the preview of a pull request once it is merged or closed (spec: D-003).
name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# The same group as the pull request's CI runs (ci.yml), so a run still on its way to the preview step is cancelled
# instead of recreating the preview after it is deleted.
concurrency:
  group: ci-pull_request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete:
    name: Delete preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request whose checks failed never got a preview; that is not an error.
      - run: |
          out=$(pnpm exec wrangler preview delete --name "pr-$PR" --skip-confirmation 2>&1) || grep -q "was not found" <<< "$out" || { echo "$out"; exit 1; }
          echo "$out"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
