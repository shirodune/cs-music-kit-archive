# Deletes the preview of a pull request once it is merged or closed (spec: D-003).
name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# The same group as the pull request's CI runs (ci.yml), so a run still on its way to the preview step is cancelled
# instead of recreating the preview after it is deleted.
concurrency:
  group: ci-pull_request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete:
    name: Delete preview
    # Only pull requests that get a preview (ci.yml): not forks, not Dependabot.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A pull request whose checks failed never got a preview; that is not an error.
      - run: |
          out=$(pnpm exec wrangler preview delete --name "pr-$PR" --skip-confirmation 2>&1) || grep -q "was not found" <<< "$out" || { echo "$out"; exit 1; }
          echo "$out"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
