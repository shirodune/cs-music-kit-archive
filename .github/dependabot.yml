# Weekly dependency updates, one grouped pull request per ecosystem. The cooldown leaves new releases a week to be
# pulled or fixed before they are proposed; pnpm itself refuses packages less than a day old.
# Workflow actions are pinned to commit SHAs (zizmor unpinned-uses); Dependabot updates the SHA and its comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # astro check does not support TypeScript 7 yet (CLAUDE.md); drop this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
